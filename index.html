<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111311">
    <meta name="description" content="手の動きでtoioを操る、見えない信号の探索ゲーム">
    <title>SIGNAL//SEEK - toio探索ゲーム</title>
    <link rel="stylesheet" href="/src/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
    <script src="https://tetunori.github.io/p5.toio/dist/0.8.0/p5.toio.min.js"></script>
    <script>
      globalThis.P5tCube = Cube;
      globalThis.P5tCube.connectNewP5tCube = Cube.connectNewCube;
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>SIGNAL//SEEK</h1>
            <p>TOIO FIELD EXPLORATION</p>
          </div>
        </div>
        <div class="telemetry" aria-label="ゲーム情報">
          <div class="telemetry-item player-score"><span>YOU</span><strong id="score">00</strong></div>
          <div class="telemetry-item rival-score"><span>RIVAL</span><strong id="rival-score">00</strong></div>
          <div class="telemetry-item"><span>TIME</span><strong id="time">60.0</strong></div>
          <div class="telemetry-item signal-readout">
            <span>SIGNAL</span><strong id="signal">--</strong><i id="signal-swatch"></i>
          </div>
        </div>
      </header>

      <main class="workspace">
        <section class="field-zone" aria-label="探索フィールド">
          <div class="section-heading">
            <div><span>MAP 01</span><h2>簡易プレイマット</h2></div>
            <div class="mode-group"><div class="versus-chip">YOU vs NPC</div><div class="mode-chip" id="mode-chip">SIMULATION</div></div>
          </div>
          <div id="canvas-host" class="canvas-host"></div>
          <div class="field-status" aria-live="polite">
            <span id="field-message">SYSTEM READY</span>
            <span id="position-readout">X 250 / Y 250 / A 000</span>
            <span id="rival-readout">RIVAL X 362 / Y 182</span>
          </div>
        </section>

        <aside class="control-zone">
          <section class="camera-tool">
            <div class="section-heading compact">
              <div><span>VISION INPUT</span><h2>ハンドトラッカー</h2></div>
              <span class="status-dot" id="camera-dot" title="カメラ状態"></span>
            </div>
            <div class="camera-frame">
              <video id="camera" playsinline muted></video>
              <div class="camera-reticle" aria-hidden="true"><i></i><i></i></div>
              <div class="direction-badge" id="hand-direction">NEUTRAL</div>
            </div>
            <div class="button-row">
              <button type="button" id="camera-button" class="secondary-button">カメラ開始</button>
              <button type="button" id="calibrate-button" class="secondary-button" disabled>中央を校正</button>
            </div>
          </section>

          <section class="connection-tool">
            <div class="section-heading compact">
              <div><span>OUTPUT</span><h2>toio接続</h2></div>
              <span class="status-dot active" id="cube-dot" title="toio状態"></span>
            </div>
            <div class="button-row">
              <button type="button" id="connect-button" class="secondary-button">toioに接続</button>
              <button type="button" id="simulation-button" class="secondary-button selected">SIM</button>
            </div>
            <div class="connection-state"><span id="connection-label">仮想toio</span><span id="battery-label">BAT 100%</span></div>
          </section>

          <section class="manual-tool">
            <div class="section-heading compact">
              <div><span>MANUAL OVERRIDE</span><h2>方向入力</h2></div>
            </div>
            <div class="direction-pad" aria-label="方向パッド">
              <button type="button" data-direction="up" aria-label="上" title="上">↑</button>
              <button type="button" data-direction="left" aria-label="左" title="左">←</button>
              <button type="button" data-direction="neutral" aria-label="停止" title="停止">■</button>
              <button type="button" data-direction="right" aria-label="右" title="右">→</button>
              <button type="button" data-direction="down" aria-label="下" title="下">↓</button>
            </div>
          </section>

          <section class="game-actions">
            <button type="button" id="start-button" class="primary-button">探索を開始</button>
            <button type="button" id="stop-button" class="stop-button" aria-label="緊急停止" title="緊急停止">■</button>
          </section>
        </aside>
      </main>
    </div>

    <script type="module" src="/src/main.mjs"></script>
  </body>
</html>
